on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel previous runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.ref }}  # Group runs by the ref (branch or PR)
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build Project
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Don't 'import Mathlib', don't "#check"
        run: |
          ! (find SpherePacking -type f -name "*.lean" -exec grep -Hn '^import Mathlib$' {} +)
          ! (find SpherePacking -type f -name "*.lean" -exec grep -Hn '^public import Mathlib$' {} +)
          ! (find SpherePacking -type f -name "*.lean" -exec grep -Hn '^#check' {} +)

      - name: Build the project
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          use-github-cache: false
      - name: "lake exe mk_all --check --module --lib SpherePacking"
        run: |
          set -e
          lake exe mk_all --check --module --lib SpherePacking

      - name: Restore Verso package builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .lake/packages/VersoBlueprint/.lake
            .lake/packages/verso/.lake
            .lake/packages/verso-slides/.lake
            .lake/packages/subverso/.lake
            .lake/packages/MD4Lean/.lake
            .lake/packages/illuminate/.lake
            .lake/packages/lean_vir/.lake
            .lake/packages/Cli/.lake
          key: ${{ runner.os }}-verso-packages-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Build the blueprint
        # The Verso blueprint links every node to its Lean declarations, so this also checks that
        # all names referenced by the blueprint exist (replacing `checkdecls`).
        run: |
          lake build SpherePackingBlueprint
          lake exe vbp build
          mkdir -p home_page
          rm -rf home_page/blueprint
          cp -r _out/site/html-multi home_page/blueprint

      - name: Compile documentation
        # workaround for https://github.com/leanprover-community/docgen-action/issues/28
        uses:  dwrensha/docgen-action@a3f8189646977363717917b605e6de25f9704656
        with:
          blueprint: false
          homepage: home_page
