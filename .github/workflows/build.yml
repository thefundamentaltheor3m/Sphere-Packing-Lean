on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel previous runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.ref }}  # Group runs by the ref (branch or PR)
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_project:
    # Pinned deliberately: do not change this back to `ubuntu-latest`.
    #
    # GitHub moved that label from ubuntu-24.04 to ubuntu-26.04 between 11 and
    # 14 Nov 2026, and every run on main has failed since. On ubuntu-26.04:
    #
    #   * the API-docs build (push to main only) dies right after doc-gen4's
    #     `coreDocs` with `resource exhausted (error code: 12, not enough
    #     memory)` when Lake spawns `git` for the `srcUri.github` targets;
    #   * `setup-ruby` does not recognise the image and reports it as
    #     self-hosted, and ubuntu-26.04 has no Ruby <= 3.1 builds at all, which
    #     `home_page`'s `github-pages` gem needs (ruby/setup-ruby#954).
    #
    # From-scratch docs builds (docs cache miss) last succeeded on ubuntu-24.04
    # in runs 42019010046 and 39395332246.
    runs-on: ubuntu-24.04
    name: Build Project
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Don't 'import Mathlib', don't "#check"
        run: |
          ! (find SpherePacking -type f -name "*.lean" -exec grep -Hn '^import Mathlib$' {} +)
          ! (find SpherePacking -type f -name "*.lean" -exec grep -Hn '^public import Mathlib$' {} +)
          ! (find SpherePacking -type f -name "*.lean" -exec grep -Hn '^#check' {} +)

      - name: Build the project
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          use-github-cache: false
      - name: "lake exe mk_all --check --module"
        run: |
          set -e
          lake exe mk_all --check --module

      - name: Compile blueprint and documentation
        # Both fixes we previously needed from dwrensha's fork are now upstream:
        # the docbuild `require` ordering (docgen-action#32) and forcing
        # doc-gen4's HTML pass to re-run after a cache hit (docgen-action#38).
        # `ruby-version` is pinned to 3.1 because home_page/Gemfile uses the
        # `github-pages` gem, which does not build on the action's 3.4 default.
        uses: leanprover-community/docgen-action@dacc1acc2a3f532cc577266979ba9c36c7593f7c
        with:
          blueprint: true
          homepage: home_page
          ruby-version: "3.1"
          # Upload and deploy are done below instead, in a separate job. When
          # `deploy-pages` runs in the same job as `upload-pages-artifact`, it
          # can query the artifact API a few milliseconds after the upload is
          # finalised and get back zero artifacts, failing with "No artifacts
          # named github-pages were found" (actions/deploy-pages#451,
          # docgen-action#43). In run 45281893877 the gap was 30ms. Splitting
          # the deploy into its own job puts job-startup latency in between,
          # which is also the pattern GitHub's own Pages starter workflow uses.
          #
          # It matters here beyond the deploy itself: `actions/cache` saves with
          # `post-if: success()`, so a failed deploy step also threw away the
          # Mathlib docs cache, making every retry another ~55 minute
          # from-scratch docs build.
          deploy: false

      - name: Upload website (API documentation, blueprint and any home page)
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.DOCS_EXISTS == 'true' && 'home_page/_site' || 'home_page/' }}

  deploy_pages:
    name: Deploy to GitHub Pages
    needs: build_project
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # v5.0.1, to match upload-pages-artifact v5.0.0 above. The action
        # bundles v4.0.5, which is two majors behind its uploader.
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
