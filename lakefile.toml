name = "SpherePacking"
defaultTargets = ["SpherePacking"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
linter.flexible = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.37.0-rc1"

# Derivative oracle of `change_var` (`SpherePacking.Tactic.ChangeVar.SymLean`). SymLean pins its
# own Mathlib: this `rev` must be a SymLean release on the same Lean and Mathlib as this project.
# PARKED: SymLean has no release for v4.37.0-rc1 yet (only v4.35.0, v4.36.0).
[[require]]
name = "SymLean"
git = "https://github.com/Robertboy18/SymLean.git"
rev = "v4.37.0-rc1"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[lean_lib]]
name = "SpherePacking"
