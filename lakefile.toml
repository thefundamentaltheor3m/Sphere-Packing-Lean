name = "SpherePacking"
defaultTargets = ["SpherePacking"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.flexible = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti.git"
rev = "v4.36.0"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[lean_lib]]
name = "SpherePacking"

# Shadows Mathlib's `cache` executable: `lake exe cache get` fetches Mathlib's oleans (by calling
# `lake exe mathlib/cache`) and then Tau Ceti's. See `scripts/Cache.lean`.
[[lean_exe]]
name = "cache"
root = "scripts.Cache"
